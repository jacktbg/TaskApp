name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🟨 Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 9 # or your preferred version

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🛠️ Build the app
        run: pnpm build

      - name: ✅ Lint the app
        run: pnpm lint

      - name: 🧪 Run tests
        run: pnpm vitest run
